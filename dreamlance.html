<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamLance App</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f19;
    color:white;
}

nav{
    background:#111827;
    padding:20px;
    color:#00aaff;
    font-size:20px;
}

.container{
    padding:20px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-bottom:20px;
    background:#111827;
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:#111827;
    padding:20px;
    border-radius:10px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.price{
    color:#00aaff;
    display:block;
    margin:10px 0;
}

button{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    margin:5px;
    background:#00aaff;
    color:white;
    cursor:pointer;
}

.whatsapp{
    background:#25d366;
}
</style>
</head>

<body>

<nav>DreamLance Marketplace</nav>

<div class="container">

<input type="text" placeholder="Search barber, plumber, electrician...">

<div class="grid">

    <div class="card">
        <h3>Tinashe</h3>
        <p>Barber - Highfield</p>
        <span class="price">$5 haircut</span>

        <button>Call</button>
        <button class="whatsapp">WhatsApp</button>
    </div>

    <div class="card">
        <h3>Mary</h3>
        <p>Hairdresser - Avondale</p>
        <span class="price">Inbox 💬</span>
        <button>Call</button>
        <button class="whatsapp">WhatsApp</button>
    </div>

    <div class="card">
        <h3>John</h3>
        <p>Electrician - CBD</p>
        <span class="price">From $10</span>

        <button>Call</button>
        <button class="whatsapp">WhatsApp</button>
    </div>

</div>

</div>

</body>
</html>
